schema_version = 1
plugin_name = "magma"

[image]
reference = "ghcr.io/auto-nomics/autonomics/magma@sha256:2ca8540251ee9201f3b7b6ac2596daa2c95bd77eb314305dac61beb9b4d85342"
tag = "1.10"
upstream = "official MAGMA 1.10 static executable @ https://ctg.cncr.nl/software/magma"

[[panels]]
binding = "gene_loc"
mount = "/panels/gene_loc"
bundle = "wjixiang/catalog-magma-gene-loc-ncbi37-3"

[[nodes]]
kind = "magma_annotate"
desc = "Runs official MAGMA v1.10 SNP-to-gene annotation in Podman."
doc = """
Runs the official MAGMA v1.10 static executable as an ephemeral Podman
container. Input is one whitespace/tab-delimited SNP location File with
SNP, chromosome, and base-pair columns. The node binds the official
NCBI37.3 gene-location catalog package, invokes `magma --annotate`, and
emits the raw MAGMA log plus `.genes.annot` as immutable VFS File
artifacts. Window extension is intentionally not exposed because this
upstream command annotates against the supplied gene-location table.
"""
timeout_secs = 300
artifact_prefix = "/artifacts/magma_annotate"

[nodes.ports]
inputs = [{ type = "file" }]
outputs = [
  { path = "magma_annotate.log", format = "magma_log" },
  { path = "magma_annotate.genes.annot", format = "magma_genes_annot" },
]

[nodes.command]
interpreter = "sh"
script_file = "scripts/annotate.sh"

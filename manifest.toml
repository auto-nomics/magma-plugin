schema_version = 1
plugin_name = "magma"

[image]
reference = "ghcr.io/auto-nomics/autonomics/magma@sha256:2ca8540251ee9201f3b7b6ac2596daa2c95bd77eb314305dac61beb9b4d85342"
tag = "1.10"
upstream = "official MAGMA 1.10 static executable @ https://ctg.cncr.nl/software/magma"

[[panels]]
binding = "gene_loc"
mount = "/panels/gene_loc"
bundle = "wjixiang/catalog-magma-gene-loc-ncbi37-3"

# Official MAGMA-distributed 1000 Genomes Phase 3 EUR reference (GRCh37,
# 503 samples, one whole-genome .bed/.bim/.fam prefix plus the .synonyms
# file MAGMA auto-detects next to it for rsID remapping). The mixer
# signed-LD panel carries chr:pos:allele BIM IDs that never align with
# rsID sumstats, and the chromosome-split QC plink-ref panel ships no
# .synonyms and would force 22 runs per analysis, so this family binds
# its own panel. v0 panels are family-level (smr precedent): both new
# kinds mount it, only magma_gene_analysis reads it.
[[panels]]
binding = "magma_ref"
mount = "/panels/magma_ref"
bundle = "wjixiang/catalog-magma-ref-g1000-eur"

[[nodes]]
kind = "magma_annotate"
desc = "Runs official MAGMA v1.10 SNP-to-gene annotation in Podman."
doc = """
Runs the official MAGMA v1.10 static executable as an ephemeral Podman
container. The node binds the official NCBI37.3 gene-location catalog
package, invokes `magma --annotate`, and emits the raw MAGMA log plus
`.genes.annot` as immutable VFS File artifacts.

INPUT CONTRACT — the file is read POSITIONALLY, and the first three
whitespace/tab-separated fields MUST be SNP ID, chromosome, and base-pair
position (extra trailing columns are ignored; a PLINK .bim file is also
accepted as-is, where column 2 is the SNP ID). Two failure modes to avoid:

- Do NOT feed a standard GWAS/LDSC summary-statistics table. Those lead
  with `SNP A1 A2 FRQ BETA SE P ...`, so MAGMA reads the A1 allele
  ("T"/"A"/"C"/"G") as the chromosome code and rejects every SNP: the run
  exits non-zero with "found no valid SNPs in file", or worse, warns per
  SNP and yields an empty annotation. Derive the three-column file first
  (join sumstats to the reference .bim by rsID), or use the 1000G .bim.
- Base-pair positions MUST be GRCh37/hg19, matching NCBI37.3. GRCh38
  positions do not fail loudly: they match almost nothing and MAGMA
  terminates with no valid SNPs, while a partially-overlapping input
  yields a quietly underpowered annotation (few SNPs per gene, weak
  p-values) with exit code 0. There is no coordinate lifting in this
  node.

GENOME-BUILD CHECK: every base-pair position must lie within 22,601,000
(GRCh37 chr1 length) to 308,832,240 (GRCh38 chr1 length); positions beyond
that bound are near-certainly GRCh38 and are rejected with an explicit
error instead of a silent near-empty result.

`window_kb` is the official MAGMA annotation window in KILOBASES
(`--annotate window=N`, default 10 = 1000bp; 0 disables it). It widens the
gene region symmetrically (or `up,down` when `ignore_strand` is set). This
is the MAGMA 1.10 flag name; `--gene-annot-window` does not exist in the
binary.
"""
timeout_secs = 300
artifact_prefix = "/artifacts/magma_annotate"

[nodes.ports]
inputs = [{ type = "file" }]
# format = "tsv" (not a family-specific tag) so this output can wire
# straight into magma_gene_analysis / magma_gene_set input ports in one DAG.
outputs = [
  { path = "magma_annotate.log", format = "magma_log" },
  { path = "magma_annotate.genes.annot", format = "tsv" },
]

[nodes.params]
window_kb = { type = "int", default = 10, min = 0.0, max = 1000.0, doc = "Official MAGMA annotation window in kilobases (--annotate window=N); 0 disables the window" }
ignore_strand = { type = "bool", default = false, doc = "Treat all genes as on the positive strand, making window_kb=up,down strand-insensitive" }

[nodes.command]
interpreter = "sh"
script_file = "scripts/annotate.sh"

[nodes.command.env]
MAGMA_ANNOT_WINDOW_KB = "{{ window_kb }}"
MAGMA_ANNOT_IGNORE_STRAND = "{{ ignore_strand }}"

[[nodes]]
kind = "magma_gene_analysis"
desc = "Runs official MAGMA v1.10 gene-level analysis of SNP p-values in Podman."
doc = """
Runs the official MAGMA v1.10 static executable for the summary-statistics
gene analysis `magma --bfile <ref> --pval <file> --gene-annot <annot>` in an
ephemeral container.

Input ports:
- port 0: GWAS summary statistics, one tab- or space-separated File (gzip
  accepted) with a header naming the SNP (rsID) and P columns; MAGMA
  auto-detects both by name. An additional N column (per-SNP sample size)
  is used when present.
- port 1: gene annotation File, the `.genes.annot` output of
  magma_annotate port 1. Gene IDs are NCBI37.3 Entrez numeric IDs.

The LD reference is the family panel at /panels/magma_ref: the official
MAGMA-distributed 1000G EUR whole-genome bfile with its .synonyms file
(rsID remapping; auto-detected by MAGMA). rsIDs in the sumstats are
matched against the reference, SNPs without p-values are skipped, and
genes with no testable SNPs are dropped by MAGMA itself.

Parameters:
- model selects the official --gene-model value. With p-value input the
  official default is snp-wise=mean; multi is the official aggregate of
  the snp-wise mean and top models (recommended for mixed architectures).
  NOTE the design-doc assumption "multi = principal-components regression"
  does not hold for summary statistics: the linreg PC model requires raw
  genotype data (v1.10 manual), so no n_pc-style parameter exists.
- top_n (>=1) turns model=snp-wise=top into snp-wise=top,K, the mean of
  the K most significant SNPs; it is rejected for any other model.
- sample_size is the fixed GWAS N passed as N=... when the sumstats carry
  no N column (required then; ignored when they do).
- batches (default 1) splits the gene analysis across N concurrent
  official --batch runs that the node merges with --merge. MAGMA v1.10 is
  single-threaded with no thread flag, so this is the only way to use more
  than one core. The v1.10 manual caps batch mode at roughly 25-30
  batches (the limit comes from the gene-gene correlation computation,
  which --genes-only would remove but gene-set analysis needs it); keep
  batches well under that. Merged results carry the same filenames and
  columns as a single run, so outputs are unchanged. Note the gene-level
  Z-scores are numerically stable only to about 1e-4 between runs —
  repeat runs of the multi model differ by the same order, so this is the
  model's own jitter, not a batching artefact.

Outputs: port 0 magma_gene_analysis.genes.out (GENE, CHR, START, STOP,
NSNPS, NPARAM, N, ZSTAT, P; multi also reports the component p-values),
port 1 magma_gene_analysis.genes.raw (the intermediate MAGMA requires as
--gene-results input for gene-set analysis — feed it to magma_gene_set
port 0), and port 2 the complete MAGMA log. The reported P is the model's
aggregate p-value and is what downstream GSA consumes.
"""
timeout_secs = 14400
artifact_prefix = "/artifacts/magma_gene_analysis"

[nodes.ports]
inputs = [
  { type = "file", label = "gwas_sumstats", accepted_formats = ["tsv", "txt", "gz"] },
  { type = "file", label = "gene_annotation", accepted_formats = ["tsv", "txt"] },
]
outputs = [
  { path = "magma_gene_analysis.genes.out", format = "tsv" },
  { path = "magma_gene_analysis.genes.raw", format = "tsv" },
  { path = "magma_gene_analysis.log", format = "magma_log" },
]

[nodes.params]
# v0 has no enum param type; the script rejects values outside
# multi / snp-wise=mean / snp-wise=top with the lava-style message.
model = { type = "string", default = "multi", doc = "Official --gene-model value: multi (aggregate of mean and top), snp-wise=mean, or snp-wise=top" }
top_n = { type = "int", optional = true, min = 1.0, doc = "Mean of the K most significant SNPs; requires and decorates model=snp-wise=top" }
sample_size = { type = "int", optional = true, min = 1.0, doc = "Fixed GWAS sample size for MAGMA N=...; required when the sumstats have no N column" }
batches = { type = "int", default = 1, min = 1.0, max = 8.0, doc = "Split the gene analysis across N concurrent official --batch runs, merged with --merge; 1 runs MAGMA once" }

[nodes.command]
interpreter = "sh"
script_file = "scripts/gene_analysis.sh"

[nodes.command.env]
MAGMA_GENE_MODEL = "{{ model }}"
MAGMA_TOP_N = "{{ top_n }}"
MAGMA_SAMPLE_SIZE = "{{ sample_size }}"
MAGMA_BATCHES = "{{ batches }}"

# Each concurrent batch is its own MAGMA process with its own reference
# load (measured ~1.4GB peak on a 5.6k-SNP / 2.2k-gene subset), so memory
# must cover batches x per-process peak. The node caps batches at 8;
# 32Gi leaves headroom for full-scale runs on all 19,427 genes.
[nodes.resources]
cpus = 8.0
memory = "32Gi"
pids_limit = 512

[[nodes]]
kind = "magma_gene_set"
desc = "Runs official MAGMA v1.10 competitive gene-set analysis in Podman."
doc = """
Runs the official MAGMA v1.10 competitive gene-set analysis
`magma --gene-results <raw> --set-annot <sets>` in an ephemeral container.

Input ports:
- port 0: gene analysis results File, the `.genes.raw` output port 1 of
  magma_gene_analysis. (.genes.out is the human-readable table and is NOT
  accepted by --gene-results; the raw file is what MAGMA designed GSA to
  read.)
- port 1: gene-set File, either MAGMA row format (one line per set: name
  followed by gene IDs) or GMT (name, description, genes). Files pass
  through untouched: MAGMA itself discards values that match no gene, so a
  GMT description column is dropped by the official reader. Gene IDs must
  be NCBI37.3 Entrez numeric IDs — use the Entrez editions of MSigDB GMTs
  (symbol editions need upstream mapping; symbols never match numeric
  Entrez IDs).

The competitive test regresses gene Z-statistics on set membership with
automatic correction for technical confounders (gene size/SNP count,
within-gene LD density, minor-allele count, sample size). v1.10 computes
it analytically — there is no permutation or minimum-set-size flag, and
none is emulated; NGENES is reported per set so filtering happens
downstream.

Outputs: port 0 magma_gene_set.gsa.out (VARIABLE, TYPE, NGENES, BETA,
BETA_STD, SE, P) and port 1 the complete MAGMA log. This is the
LD-and-gene-size-aware alternative to Enrichr-style over-representation
tests; unlike Enrichr it uses every gene's statistic, not a top-N list.
"""
timeout_secs = 1800
artifact_prefix = "/artifacts/magma_gene_set"

[nodes.ports]
inputs = [
  { type = "file", label = "gene_results_raw", accepted_formats = ["tsv", "txt"] },
  { type = "file", label = "gene_sets", accepted_formats = ["gmt", "tsv", "txt"] },
]
outputs = [
  { path = "magma_gene_set.gsa.out", format = "magma_gsa_out" },
  { path = "magma_gene_set.log", format = "magma_log" },
]

[nodes.params]
# Unset means the official defaults (correct=all). The script rejects
# anything but all/none; the per-variable include/exclude lists are the
# recorded not-exposed surface.
correct = { type = "string", optional = true, doc = "Technical covariate correction: all (official default) or none" }

[nodes.command]
interpreter = "sh"
script_file = "scripts/gene_set.sh"

[nodes.command.env]
MAGMA_GENE_SET_CORRECT = "{{ correct }}"

[nodes.resources]
cpus = 2.0
memory = "4Gi"
pids_limit = 512
